name: Build
run-name: Build for [${{ inputs.service_name }}] by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      service_name:
        description: "service to build"
        required: true
        type: choice
        options:
          - all
          - a-serivce
          - b-service
          - lib-service

env:
  JOBS: |
    '{
      "a-service": "cmd/a-service",
      "b-service": "cmd/b-service",
      "lib-service": "lib/cmd"
    }'

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Generate matrix for "all" option
        id: set-matrix
        run: |
          if [[ "${{ inputs.service_name }}" == "all" ]]; then
            echo "matrix=$(echo $JOBS | jq -c 'keys')" >> $GITHUB_OUTPUT
          else
            echo "matrix=[\"${{ inputs.service_name }}\"]" >> $GITHUB_OUTPUT
          fi

  build:
    runs-on: ubuntu-latest
    needs: setup
    strategy:
      matrix:
        service_name: ${{ fromJson(needs.setup.outputs.matrix) }}

    steps:
      - name: Determine build path
        run: |
          # jobs=${{ env.JOBS }}
          # echo $jobs
          # echo "JOB_PATH=$(echo $jobs| jq -r '."${{ inputs.service_name }}"')" >> $GITHUB_ENV
          # echo $JOB_PATH
          JOB_PATH=$(echo '${{ env.JOBS }}' | jq -r '."${{ matrix.service_name }}"')
          echo "JOB_PATH=$JOB_PATH" >> $GITHUB_ENV
          echo "Using path: $JOB_PATH"

      - uses: actions/checkout@v4

      - name: Setup
        uses: actions/setup-go@v5
        with:
          go-version-file: "./go.mod"

      - name: Build ${{ matrix.service_name }}
        run: |
          cd $JOB_PATH
          go build -o amd64

      - name: Run ${{ matrix.service_name }}
        run: |
          cd $JOB_PATH
          ./amd64
